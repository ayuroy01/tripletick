name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If you can reproduce it in the demo (`npm run demo`), say so.
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options: [Simulator, WhatsApp Cloud API]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove phone numbers, tokens and message text first.
      render: shell
